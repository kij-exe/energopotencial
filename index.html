<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График энергопотенциала</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Калькулятор графика энергопотенциала по дате рождения: график «Жизнь» по годам и график «Год» по месяцам.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a calculator band (date + "now" status) over two instrument panels — Life by years, Year by months — then zero periods and the number key. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --ink: #141b2d;
  --muted: #586178;
  --line: #d4d9e4;
  --accent: #2c41b0;
  --accent-ink: #ffffff;
  --zero: #c4352a;
  --zero-soft: rgba(196, 53, 42, .12);

  --b0: #fbe9e6; --b1: #ffd6cf; --b2: #ffe2c4; --b3: #fff2b5; --b4: #c8f0d4;
  --b5: #c6eef2; --b6: #cfe1f8; --b7: #e0dcfa; --b8: #f3dc96; --b9: #e3e6ee;

  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2d; --ink: #e6eaf3; --muted: #98a1b6; --line: #2a3349;
    --accent: #93a5ff; --accent-ink: #0e1320; --zero: #ff7b6c; --zero-soft: rgba(255, 123, 108, .14);
    --b0: #2c1b20; --b1: #3d2328; --b2: #3b2d1f; --b3: #36331c; --b4: #1b3527;
    --b5: #18343a; --b6: #1b2a42; --b7: #29253f; --b8: #3c3219; --b9: #252a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2d; --ink: #e6eaf3; --muted: #98a1b6; --line: #2a3349;
  --accent: #93a5ff; --accent-ink: #0e1320; --zero: #ff7b6c; --zero-soft: rgba(255, 123, 108, .14);
  --b0: #2c1b20; --b1: #3d2328; --b2: #3b2d1f; --b3: #36331c; --b4: #1b3527;
  --b5: #18343a; --b6: #1b2a42; --b7: #29253f; --b8: #3c3219; --b9: #252a35;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: grid;
  gap: 28px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(22px, 3.6vw, 34px); line-height: 1.15; }
h2 { font-size: 20px; line-height: 1.25; }
h3 { font-size: 14px; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top .lede { max-width: 62ch; margin-top: 8px; color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* calculator band */
.band { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
form.birth { display: grid; gap: 14px; align-content: start; }
.fields { display: grid; grid-template-columns: 72px minmax(0, 1fr) 96px; gap: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .ctl select, .ctl input {
  width: 100%; min-width: 0; height: 42px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  font-family: var(--f-mono); font-size: 16px; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--f-body); }
.btn { height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.formrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.err { color: var(--zero); font-size: 13px; min-height: 1.2em; }
.sample { font-size: 13px; color: var(--muted); }
.sample b { font-weight: 600; color: var(--ink); }

.now { display: grid; gap: 14px; }
.now-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px; border-radius: 8px; background: var(--bg); }
.stat .big { grid-row: span 3; width: 56px; height: 64px; display: grid; place-items: center; border-radius: 8px; font: 700 34px/1 var(--f-display); }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .mean { font-weight: 500; line-height: 1.3; }
.stat .when { font: 400 12px/1.3 var(--f-mono); color: var(--muted); }
.zz { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border: 1px dashed var(--line); font-size: 14px; }
.zz.on { border: 1px solid var(--zero); background: var(--zero-soft); }
.zz .dot { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--line); }
.zz.on .dot { background: var(--zero); }

/* panels */
.panel { display: grid; gap: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font: 500 clamp(18px, 2.6vw, 24px)/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.formula .op { color: var(--muted); font-weight: 400; }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-grid; place-items: center; min-width: 30px; height: 36px; padding: 0 6px; border-radius: 6px; font: 600 20px/1 var(--f-mono); color: var(--ink); }
.chip.z { box-shadow: inset 0 0 0 2px var(--zero); }
.hint { font-size: 13px; color: var(--muted); }
.ctls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ctl input { width: 84px; height: 34px; font-size: 14px; }
.ctl select { height: 34px; font-size: 14px; width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 0 12px; height: 32px; font-size: 13px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.chart { position: relative; min-width: 0; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.chart .yl { fill: var(--ink); font-weight: 600; }
.chart .tl { fill: var(--accent); font-weight: 600; }
.tip {
  position: absolute; pointer-events: none; z-index: 2; min-width: 160px; max-width: 240px;
  padding: 10px 12px; border-radius: 8px; background: var(--ink); color: var(--bg);
  font-size: 13px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.tip .tv { font: 700 22px/1 var(--f-display); margin-block: 4px; }
.tip .td { font: 400 11px/1.3 var(--f-mono); opacity: .8; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.pts { border-collapse: collapse; width: 100%; font: 400 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
table.pts th, table.pts td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.pts tr:last-child td { border-bottom: 0; }
table.pts th { font: 700 18px/1 var(--f-mono); color: var(--ink); }
table.pts th.rowh, table.pts td.rowh { text-align: left; font: 500 12px/1.2 var(--f-body); color: var(--muted); }
table.pts td.out { color: var(--muted); opacity: .45; }
table.pts td.cur { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 4px; font-weight: 600; color: var(--accent); }
table.pts td button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }

/* zero periods */
.zlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.zlist li { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-family: var(--f-mono); font-size: 14px; }
.zlist li .ago { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.zlist li button { margin-left: auto; }

/* legend */
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; padding: 4px 0; }
.legend .chip { width: 36px; }

/* point details: centered card on desktop, bottom sheet on phones */
body:has(dialog[open]) { overflow: hidden; }
dialog.sheet {
  border: 0; padding: 0; margin: auto;
  width: min(520px, calc(100% - 32px)); max-width: none; max-height: min(86vh, 760px);
  border-radius: 14px; background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3); overflow: hidden;
}
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(8, 12, 22, .5); }
.grip { display: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { font: 500 18px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.sheet-body { padding: 16px 20px; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 14px; align-content: start; }
.sheet-foot { display: flex; gap: 8px; padding: 12px 20px max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet-foot .grow { flex: 1; }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-size: 22px; line-height: 1; }
.sv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.sv .big { width: 64px; height: 72px; display: grid; place-items: center; border-radius: 10px; font: 700 40px/1 var(--f-display); }
.sv .big.z { box-shadow: inset 0 0 0 2px var(--zero); }
.sv .mean { font-weight: 500; line-height: 1.35; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.badge { padding: 2px 8px; border-radius: 999px; font: 600 11px/1.5 var(--f-body); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); }
.badge.z { background: var(--zero); color: var(--surface); }
.sub { display: grid; gap: 8px; }
.sub .formula-s { font: 400 13px/1.3 var(--f-mono); color: var(--muted); }
.lifelvl { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.lifelvl .chip { grid-row: span 2; width: 36px; }
.lifelvl .when, .mlist .when { font: 400 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.lifelvl .m, .mlist .m { font-size: 12px; line-height: 1.3; color: var(--muted); }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.mlist li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
.mlist li .chip { grid-row: span 2; width: 36px; height: 34px; font-size: 18px; }
.mlist li.zz { background: var(--zero-soft); }
.mlist li.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.mlist .top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mlist .badge { font-size: 10px; padding: 0 6px; }
@media (max-width: 600px) {
  dialog.sheet { margin: auto 0 0; width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; }
  .grip { display: block; flex: none; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
  .sheet-head { padding-top: 10px; }
  .sheet-head, .sheet-body, .sheet-foot {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}
@media (prefers-reduced-motion: no-preference) {
  dialog.sheet[open] { animation: pop .18s ease-out; }
}
@media (prefers-reduced-motion: no-preference) and (max-width: 600px) {
  dialog.sheet[open] { animation: rise .22s ease-out; }
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes rise { from { transform: translateY(100%); } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot { font-size: 12px; color: var(--muted); max-width: 80ch; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

@media (max-width: 860px) {
  .band, .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .now-grid, .legend { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  .fields { grid-template-columns: 60px minmax(0, 1fr) 84px; }
  table.pts th, table.pts td { padding: 6px 5px; font-size: 12px; }
  table.pts th { font-size: 16px; }
  /* 16px keeps iOS from zooming in on focus */
  .ctl input, .ctl select { font-size: 16px; height: 38px; }
  .seg button { height: 36px; }
  .btn.small { height: 38px; }
  .panel-head .ctls { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .chart path.ln { transition: d .3s ease; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow">Динамика состояний</div>
      <h1 data-i="title">График энергопотенциала</h1>
      <p class="lede" data-i="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uk">UA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="band">
    <form class="card birth" id="birthForm" novalidate>
      <h2 data-i="birth">Дата рождения</h2>
      <div class="fields">
        <div class="field"><label for="inDay" data-i="day">День</label><input id="inDay" inputmode="numeric" autocomplete="bday-day" maxlength="2"></div>
        <div class="field"><label for="inMonth" data-i="month">Месяц</label><select id="inMonth" autocomplete="bday-month"></select></div>
        <div class="field"><label for="inYear" data-i="year">Год</label><input id="inYear" inputmode="numeric" autocomplete="bday-year" maxlength="4"></div>
      </div>
      <div class="formrow">
        <button class="btn" type="submit" data-i="build">Построить</button>
        <span class="sample" id="sampleNote"></span>
      </div>
      <div class="err" id="err" role="alert"></div>
    </form>

    <div class="card now" aria-live="polite">
      <div class="panel-head">
        <h2 data-i="now">Сейчас</h2>
        <span class="eyebrow" id="todayLbl"></span>
      </div>
      <div class="now-grid" id="nowGrid"></div>
      <div class="zz" id="zzNow"><span class="dot"></span><span></span></div>
    </div>
  </section>

  <section class="card panel" id="lifePanel">
    <div class="panel-head">
      <div>
        <div class="eyebrow" data-i="lifeEyebrow">График «Жизнь»</div>
        <h2 data-i="lifeTitle">Энергопотенциал по годам</h2>
      </div>
      <div class="ctls">
        <div class="seg" role="group" id="lifePresets">
          <button type="button" data-preset="near" data-i="pNear">±10 лет</button>
          <button type="button" data-preset="birth" data-i="pBirth">С рождения</button>
          <button type="button" data-preset="life" data-i="pLife">90 лет</button>
        </div>
        <span class="ctl"><label for="inFrom" data-i="from">с</label><input id="inFrom" inputmode="numeric" maxlength="4"></span>
        <span class="ctl"><label for="inTo" data-i="to">по</label><input id="inTo" inputmode="numeric" maxlength="4"></span>
      </div>
    </div>
    <div class="formula" id="lifeFormula"></div>
    <p class="hint" id="lifeHint"></p>
    <div class="chart" id="lifeChart"></div>
    <div class="tablebox"><table class="pts" id="lifeTable"></table></div>
  </section>

  <section class="card panel" id="yearPanel">
    <div class="panel-head">
      <div>
        <div class="eyebrow" data-i="yearEyebrow">График «Год»</div>
        <h2 id="yearTitle"></h2>
      </div>
      <div class="ctls">
        <button class="btn ghost small" type="button" id="prevYear" aria-label="−1">←</button>
        <span class="ctl"><label for="inPeriod" class="sr" data-i="periodLbl">Год</label><select id="inPeriod"></select></span>
        <button class="btn ghost small" type="button" id="nextYear" aria-label="+1">→</button>
        <button class="btn ghost small" type="button" id="curYear" data-i="current">Текущий</button>
      </div>
    </div>
    <div class="formula" id="yearFormula"></div>
    <p class="hint" id="yearHint"></p>
    <div class="chart" id="yearChart"></div>
    <div class="tablebox"><table class="pts" id="yearTable"></table></div>
  </section>

  <section class="split">
    <div class="card panel">
      <div>
        <div class="eyebrow" data-i="zzEyebrow">Ноль в нуле</div>
        <h2 data-i="zzTitle">Ближайшие периоды «ноль в нуле»</h2>
      </div>
      <p class="hint" data-i="zzExplain"></p>
      <ul class="zlist" id="zzList"></ul>
    </div>
    <div class="card panel">
      <div>
        <div class="eyebrow" data-i="legendEyebrow">Ключ</div>
        <h2 data-i="legendTitle">Значение чисел</h2>
      </div>
      <ul class="legend" id="legend"></ul>
    </div>
  </section>

  <p class="foot" data-i="disclaimer"></p>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <div>
      <div class="eyebrow" id="sheetKind"></div>
      <h3 id="sheetTitle"></h3>
    </div>
    <button class="iconbtn" type="button" id="sheetClose">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="btn ghost" type="button" id="sheetPrev">←</button>
    <button class="btn grow" type="button" id="sheetOpen"></button>
    <span class="grow" id="sheetSpacer"></span>
    <button class="btn ghost" type="button" id="sheetNext">→</button>
  </div>
</dialog>

<script>
(() => {
  "use strict";

  /* ---------- copy ---------- */
  const T = {
    ru: {
      locale: "ru-RU",
      eyebrow: "Динамика состояний",
      title: "График энергопотенциала",
      lede: "Введите дату рождения. Калькулятор перемножит день, месяц и год и построит два графика: «Жизнь» — по годам, «Год» — по месяцам выбранного года. Каждый график начинается с дня рождения.",
      birth: "Дата рождения", day: "День", month: "Месяц", year: "Год", build: "Построить",

  function plural(lang, n, forms) {
    const r = new Intl.PluralRules(lang).select(n);
    return r === "one" ? forms[0] : r === "few" ? forms[1] : forms[2];
  }

  /* ---------- storage (per-viewer convenience only) ---------- */
  const store = {
    get(k) { try { return localStorage.getItem("ep:" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("ep:" + k, v); } catch (e) {} }
  };

  /* ---------- date + numerology core ---------- */
  const dim = (y, m) => new Date(y, m, 0).getDate();           // m is 1-based
  const mkDate = (y, m0, d) => {                                 // m0 0-based, may overflow
    const yy = y + Math.floor(m0 / 12), mm = ((m0 % 12) + 12) % 12;
    return new Date(yy, mm, Math.min(d, dim(yy, mm + 1)));
  };
  const digits = n => String(n).split("").map(Number);
  const today = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();

  function model(d, m, y) {
    const lifeProduct = d * m * y;
    const lifeDigits = digits(lifeProduct);
    const L = lifeDigits.length;
    const bday = Y => mkDate(Y, m - 1, d);
    const lifeValue = Y => Y < y ? null : lifeDigits[(Y - y) % L];
    const periodOf = t => { const Y = t.getFullYear(); return t >= bday(Y) ? Y : Y - 1; };
    function yearPoints(Y) {
      const D = digits(d * m * Y);
      const pts = [];
      for (let k = 0; k < 12; k++) {
        const t = mkDate(Y, m - 1 + k, d);
        const end = k < 11 ? mkDate(Y, m + k, d) : bday(Y + 1);
        pts.push({ t, end, v: D[k % D.length], k });
      }
      return { product: d * m * Y, digits: D, pts };
    }
    return { d, m, y, lifeProduct, lifeDigits, L, bday, lifeValue, periodOf, yearPoints };
  }

  function zeroPeriods(M, fromY, years) {
    const out = [];
    for (let Y = Math.max(M.y, fromY); Y < fromY + years; Y++) {
      if (M.lifeValue(Y) !== 0) continue;
      const { pts } = M.yearPoints(Y);
      let cur = null;
      for (const p of pts) {
        if (p.v === 0) {
          if (cur) cur.end = p.end; else cur = { start: p.t, end: p.end, Y };
        } else if (cur) { out.push(cur); cur = null; }
      }
      if (cur) out.push(cur);
    }
    // merge across birthday boundary
    const merged = [];
    for (const z of out) {
      const last = merged[merged.length - 1];
      if (last && +last.end === +z.start) last.end = z.end; else merged.push({ ...z });
    }
    return merged;
  }

  /* ---------- state ---------- */
  const SAMPLE = { d: 27, m: 6, y: 1956 };
  const S = { lang: "ru", d: SAMPLE.d, m: SAMPLE.m, y: SAMPLE.y, isSample: true, from: 0, to: 0, preset: "near", period: 0 };
  let M = null;

  const $ = id => document.getElementById(id);
  const t = k => T[S.lang][k];
  const fmt = (dt, withYear = true) => {
    const dd = String(dt.getDate()).padStart(2, "0"), mm = String(dt.getMonth() + 1).padStart(2, "0");
    return withYear ? `${dd}.${mm}.${dt.getFullYear()}` : `${dd}.${mm}`;
  };
  const dayBefore = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - 1);
  const band = v => `var(--b${v})`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function applyPreset(p) {
    const nowY = today.getFullYear();
    S.preset = p;
    if (p === "near") { S.from = Math.max(M.y, nowY - 10); S.to = Math.max(S.from + 10, nowY + 10); }
    if (p === "birth") { S.from = M.y; S.to = Math.max(M.y + 10, nowY + 10); }
    if (p === "life") { S.from = M.y; S.to = M.y + 90; }
  }

  /* ---------- chart ---------- */
  let chartSeq = 0;
  function drawChart(host, cfg) {
    const W = Math.max(280, host.clientWidth || 700);
    const H = Math.round(Math.max(250, Math.min(400, W * 0.5)));
    const mg = { l: 30, r: cfg.overlay != null ? 54 : 14, t: 22, b: 30 };
    const iw = W - mg.l - mg.r, ih = H - mg.t - mg.b;
    const t0 = +cfg.domain[0], t1 = +cfg.domain[1];
    const pad = 6;
    const X = tt => mg.l + pad + (tt - t0) / (t1 - t0) * (iw - 2 * pad);
    const Y = v => mg.t + (9.5 - v) / 10 * ih;
    const id = "c" + (++chartSeq);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.label)}">`;
    s += `<defs><clipPath id="${id}"><rect x="${mg.l}" y="${mg.t - 6}" width="${iw}" height="${ih + 12}"/></clipPath>
      <pattern id="${id}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--b0)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--zero)" stroke-opacity=".22" stroke-width="2"/></pattern></defs>`;
    for (let v = 0; v <= 9; v++) {
      s += `<rect x="${mg.l}" y="${Y(v + .5)}" width="${iw}" height="${ih / 10}" fill="${v === 0 ? `url(#${id}h)` : band(v)}"/>`;
      s += `<text class="yl" x="${mg.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    }
    // highlighted windows (zero in zero)
    for (const w of cfg.windows || []) {
      const a = Math.max(X(+w.start), mg.l), b = Math.min(X(+w.end), mg.l + iw);
      if (b > a) s += `<rect x="${a}" y="${mg.t}" width="${b - a}" height="${ih}" fill="var(--zero)" fill-opacity=".16"/>`;
    }
    // x ticks
    let lastX = -1e9;
    for (const tk of cfg.ticks) {
      const x = X(+tk.t);
      if (x < mg.l - 1 || x > mg.l + iw + 1) continue;
      s += `<line x1="${x}" x2="${x}" y1="${mg.t}" y2="${mg.t + ih}" stroke="var(--ink)" stroke-opacity=".07"/>`;
      if (x - lastX >= cfg.minTickGap) {
        s += `<text x="${x}" y="${H - 10}" text-anchor="middle">${esc(tk.label)}</text>`;
        lastX = x;
      }
    }
    s += `<rect x="${mg.l}" y="${mg.t}" width="${iw}" height="${ih}" fill="none" stroke="var(--line)"/>`;
    // today
    if (+today >= t0 && +today <= t1) {
      const x = X(+today);
      s += `<line x1="${x}" x2="${x}" y1="${mg.t - 6}" y2="${mg.t + ih}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      s += `<text class="tl" x="${x}" y="${mg.t - 9}" text-anchor="middle">${esc(t("today"))}</text>`;
    }
    // overlay level
    if (cfg.overlay != null) {
      const yy = Y(cfg.overlay);
      s += `<line x1="${mg.l}" x2="${mg.l + iw}" y1="${yy}" y2="${yy}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity=".7"/>`;
      s += `<text class="yl" x="${mg.l + iw + 6}" y="${yy + 4}">${esc(t("life"))} ${cfg.overlay}</text>`;
    }
    // line
    const line = cfg.points.concat(cfg.tail ? [cfg.tail] : []);
    if (line.length) {
      const d = line.map((p, i) => `${i ? "L" : "M"}${X(+p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
      s += `<g clip-path="url(#${id})"><path class="ln" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round"/>`;
      for (const p of cfg.points) {
        const x = X(+p.t), y = Y(p.v);
        s += p.v === 0
          ? `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--surface)" stroke="var(--zero)" stroke-width="2.25"/>`
          : `<circle cx="${x}" cy="${y}" r="${cfg.points.length > 60 ? 2 : 3.5}" fill="var(--accent)"/>`;
      }
      s += `</g>`;
    }
    s += `<circle class="focus" r="7" fill="none" stroke="var(--ink)" stroke-width="2" visibility="hidden"/>`;
    s += `</svg><div class="tip" hidden></div>`;
    host.innerHTML = s;

    const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), focus = svg.querySelector(".focus");
    const visible = cfg.points.filter(p => X(+p.t) >= mg.l - 1 && X(+p.t) <= mg.l + iw + 1);
    function nearest(ev) {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      let best = null, bd = Infinity;
      for (const p of visible) { const dd = Math.abs(X(+p.t) - px); if (dd < bd) { bd = dd; best = p; } }
      return { best, scale: r.width / W };
    }
    function show(ev) {
      const { best, scale } = nearest(ev);
      if (!best) return;
      const cx = X(+best.t), cy = Y(best.v);
      focus.setAttribute("cx", cx); focus.setAttribute("cy", cy); focus.setAttribute("visibility", "visible");
      tip.innerHTML = `<div class="td">${esc(best.range)}</div><div class="tv">${best.v}</div><div>${esc(t("meanings")[best.v])}</div>`;
      tip.hidden = false;
      const hw = host.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = cx * scale + 14; if (left + tw > hw) left = cx * scale - tw - 14; if (left < 0) left = 0;
      let top = cy * scale - th / 2; top = Math.max(0, Math.min(top, H * scale - th));
      tip.style.left = left + "px"; tip.style.top = top + "px";
    }
    function hide() { tip.hidden = true; focus.setAttribute("visibility", "hidden"); }
    // hover tooltip is for mice only; a tap (or click) opens the details sheet
    svg.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse") show(ev); });
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("click", ev => {
      const { best } = nearest(ev);
      hide();
      if (best && cfg.onPick) cfg.onPick(best, visible);
    });
    svg.style.cursor = "pointer";
  }

  /* ---------- renderers ---------- */
  const chips = D => `<span class="chips">${D.map(v => `<span class="chip${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span>`).join("")}</span>`;

  function renderStatic() {
    document.documentElement.lang = S.lang === "uk" ? "uk" : S.lang;
    document.querySelectorAll("[data-i]").forEach(el => { const v = t(el.dataset.i); if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
    document.title = t("title");
    const mSel = $("inMonth"), keep = mSel.value || String(S.m);
    const mf = new Intl.DateTimeFormat(t("locale"), { month: "long" });
    mSel.innerHTML = Array.from({ length: 12 }, (_, i) => {
      const name = mf.format(new Date(2000, i, 1));
      return `<option value="${i + 1}">${String(i + 1).padStart(2, "0")} · ${name.charAt(0).toUpperCase() + name.slice(1)}</option>`;
    }).join("");
    mSel.value = keep;
    $("legend").innerHTML = t("meanings").map((txt, v) => ({ txt, v })).reverse()
      .map(({ txt, v }) => `<li><span class="chip${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span><span>${esc(txt)}</span></li>`).join("");
    $("todayLbl").textContent = fmt(today);
  }

  function renderNow() {
    const grid = $("nowGrid"), zz = $("zzNow");
    const birth = M.bday(M.y);
    if (today < birth) {
      grid.innerHTML = `<p class="muted">${esc(t("notBorn"))}</p>`;
      zz.hidden = true;
      return;
    }
    zz.hidden = false;
    const Y = M.periodOf(today);
    const lv = M.lifeValue(Y);
    const yp = M.yearPoints(Y).pts;
    const mp = yp.filter(p => p.t <= today).pop();
    const card = (lbl, v, from, to) => `<div class="stat"><span class="big" style="background:${band(v)}${v === 0 ? ";box-shadow:inset 0 0 0 2px var(--zero)" : ""}">${v}</span>
      <span class="lbl">${esc(lbl)}</span><span class="mean">${esc(t("meanings")[v])}</span>
      <span class="when">${fmt(from)} ${esc(t("until"))} ${fmt(dayBefore(to))}</span></div>`;
    grid.innerHTML = card(t("lifeNow"), lv, M.bday(Y), M.bday(Y + 1)) + card(t("monthNow"), mp.v, mp.t, mp.end);
    const on = lv === 0 && mp.v === 0;
    zz.classList.toggle("on", on);
    let msg = on ? t("zzOn") : t("zzOff");
    if (!on) {
      const next = zeroPeriods(M, Y, 60).find(z => z.start > today);
      if (next) msg += " " + t("zzNext").replace("{date}", fmt(next.start));
    }
    zz.lastElementChild.textContent = msg;
  }

  function renderLife() {
    $("inFrom").value = S.from; $("inTo").value = S.to;
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.preset === S.preset)));
    $("lifeFormula").innerHTML = `<span>${M.d}</span><span class="op">×</span><span>${M.m}</span><span class="op">×</span><span>${M.y}</span><span class="op">=</span><span>${M.lifeProduct}</span><span class="op">→</span>${chips(M.lifeDigits)}`;
    $("lifeHint").textContent = t("lifeHint").replace("{n}", t("years")(M.L));
    const pts = [];
    for (let Yr = Math.max(M.y, S.from - 1); Yr <= S.to + 1; Yr++) {
      pts.push({ t: M.bday(Yr), v: M.lifeValue(Yr), Y: Yr, range: `${fmt(M.bday(Yr))} – ${fmt(dayBefore(M.bday(Yr + 1)))}` });
    }
    const span = S.to - S.from;
    const ticks = [];
    const step = [1, 2, 5, 10, 20].find(st => st * ($("lifeChart").clientWidth || 700) / Math.max(1, span) >= 46) || 20;
    for (let Yr = S.from; Yr <= S.to; Yr++) if ((Yr - S.from) % step === 0 || Yr === S.to) ticks.push({ t: M.bday(Yr), label: String(Yr) });
    drawChart($("lifeChart"), {
      label: t("lifeTitle"), domain: [M.bday(S.from), M.bday(S.to)], points: pts, ticks, minTickGap: 34,
      onPick: (p, vis) => { const items = vis.map(q => q.Y); openSheet("life", items, items.indexOf(p.Y)); }
    });
    // table: like the method's own — digits across, years down
    const cur = today >= M.bday(M.y) ? M.periodOf(today) : null;
    const start = M.y + Math.floor((S.from - M.y) / M.L) * M.L;
    let h = `<tr><th class="rowh">${esc(t("colValue"))}</th>${M.lifeDigits.map(v => `<th style="background:${band(v)}">${v}</th>`).join("")}</tr>`;
    let first = true;
    for (let r = start; r <= S.to; r += M.L) {
      h += `<tr>${first ? `<td class="rowh" rowspan="${Math.floor((S.to - start) / M.L) + 1}">${esc(t("colYear"))}</td>` : ""}`;
      first = false;
      for (let k = 0; k < M.L; k++) {
        const Yr = r + k, out = Yr < S.from || Yr > S.to;
        h += `<td class="${out ? "out" : ""}${Yr === cur ? " cur" : ""}">${out ? Yr : `<button type="button" data-year="${Yr}">${Yr}</button>`}</td>`;
      }
      h += `</tr>`;
    }
    $("lifeTable").innerHTML = h;
  }

  function renderYear() {
    const Yr = S.period;
    const sel = $("inPeriod");
    sel.innerHTML = Array.from({ length: 101 }, (_, i) => M.y + i).map(v => `<option value="${v}">${v} – ${v + 1}</option>`).join("");
    sel.value = String(Yr);
    $("prevYear").disabled = Yr <= M.y; $("nextYear").disabled = Yr >= M.y + 100;
    const { product, digits: D, pts } = M.yearPoints(Yr);
    $("yearTitle").textContent = t("yearTitle").replace("{date}", fmt(M.bday(Yr)));
    $("yearFormula").innerHTML = `<span>${M.d}</span><span class="op">×</span><span>${M.m}</span><span class="op">×</span><span>${Yr}</span><span class="op">=</span><span>${product}</span><span class="op">→</span>${chips(D)}`;
    $("yearHint").textContent = t("yearHint");
    const lv = M.lifeValue(Yr);
    const mf = new Intl.DateTimeFormat(t("locale"), { month: "short" });
    const points = pts.map(p => ({ ...p, range: `${fmt(p.t)} – ${fmt(dayBefore(p.end))}` }));
    const windows = lv === 0 ? zeroPeriods(M, Yr, 1) : [];
    drawChart($("yearChart"), {
      label: $("yearTitle").textContent, domain: [M.bday(Yr), M.bday(Yr + 1)], points,
      tail: { t: M.bday(Yr + 1), v: pts[11].v },
      ticks: pts.map(p => ({ t: p.t, label: `${p.t.getDate()} ${mf.format(p.t).replace(".", "")}` })),
      minTickGap: 52, overlay: lv, windows,
      onPick: p => openSheet("year", pts.map(q => ({ Y: Yr, k: q.k })), p.k)
    });
    const rows = Math.ceil(12 / D.length);
    let h = `<tr><th class="rowh">${esc(t("colValue"))}</th>${D.map(v => `<th style="background:${band(v)}">${v}</th>`).join("")}</tr>`;
    for (let r = 0; r < rows; r++) {
      h += `<tr>${r === 0 ? `<td class="rowh" rowspan="${rows}">${esc(t("colStart"))}</td>` : ""}`;
      for (let c = 0; c < D.length; c++) {
        const p = pts[r * D.length + c];
        if (!p) { h += `<td></td>`; continue; }
        const isCur = today >= p.t && today < p.end;
        const withYear = p.k === 0 || p.k === 11 || p.t.getMonth() === 0;
        h += `<td class="${isCur ? "cur" : ""}">${fmt(p.t, withYear)}</td>`;
      }
      h += `</tr>`;
    }
    $("yearTable").innerHTML = h;
  }

  function renderZeroList() {
    const startY = Math.max(M.y, today >= M.bday(M.y) ? M.periodOf(today) : M.y);
    const list = zeroPeriods(M, startY, 60).filter(z => z.end > today).slice(0, 8);
    $("zzList").innerHTML = list.length ? list.map(z => {
      const now = today >= z.start && today < z.end;
      return `<li><span>${fmt(z.start)} – ${fmt(dayBefore(z.end))}</span>${now ? `<span class="ago">${esc(t("inNow"))}</span>` : ""}<button class="btn ghost small" type="button" data-year="${z.Y}">${esc(t("show"))}</button></li>`;
    }).join("") : `<li class="muted">${esc(t("zzNone"))}</li>`;
  }

  /* ---------- point details sheet ---------- */
  const sheet = { kind: null, items: [], idx: 0 };
  const isNow = (a, b) => today >= a && today < b;
  const badge = (cls, txt) => `<span class="badge${cls}">${esc(txt)}</span>`;
  const chip = v => `<span class="chip${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span>`;
  const range = (a, b) => `${fmt(a)} – ${fmt(dayBefore(b))}`;

  function openSheet(kind, items, idx) {
    sheet.kind = kind; sheet.items = items; sheet.idx = Math.max(0, idx);
    renderSheet();
    const dlg = $("sheet");
    if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); } }
  }
  function closeSheet() {
    const dlg = $("sheet");
    if (dlg.open) { try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); } }
    sheet.kind = null;
  }
  function stepSheet(dir) {
    const i = sheet.idx + dir;
    if (i < 0 || i >= sheet.items.length) return;
    sheet.idx = i; renderSheet();
  }

  function renderSheet() {
    if (!sheet.kind) return;
    const it = sheet.items[sheet.idx];
    const means = t("meanings");
    let head, body;
    if (sheet.kind === "life") {
      const Yr = it, a = M.bday(Yr), b = M.bday(Yr + 1), v = M.lifeValue(Yr);
      const yp = M.yearPoints(Yr);
      head = range(a, b);
      body = `<div class="sv"><span class="big${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span>
          <div><div class="mean">${esc(means[v])}</div>${isNow(a, b) ? `<div class="badges">${badge("", t("nowBadge"))}</div>` : ""}</div></div>
        <div class="sub"><div class="eyebrow">${esc(t("byMonth"))}</div>
          <div class="formula-s">${M.d} × ${M.m} × ${Yr} = ${yp.product}</div>
          <ul class="mlist">${yp.pts.map(p => {
            const zz = v === 0 && p.v === 0, cur = isNow(p.t, p.end);
            return `<li class="${zz ? "zz" : ""}${cur ? " cur" : ""}">${chip(p.v)}
              <span class="top-row"><span class="when">${range(p.t, p.end)}</span>${cur ? badge("", t("nowBadge")) : ""}${zz ? badge(" z", t("zzBadge")) : ""}</span>
              <span class="m">${esc(means[p.v])}</span></li>`;
          }).join("")}</ul></div>`;
    } else {
      const Yr = it.Y, p = M.yearPoints(Yr).pts[it.k], lv = M.lifeValue(Yr);
      const zz = lv === 0 && p.v === 0, cur = isNow(p.t, p.end);
      head = range(p.t, p.end);
      body = `<div class="sv"><span class="big${p.v === 0 ? " z" : ""}" style="background:${band(p.v)}">${p.v}</span>
          <div><div class="mean">${esc(means[p.v])}</div>${cur || zz ? `<div class="badges">${cur ? badge("", t("nowBadge")) : ""}${zz ? badge(" z", t("zzBadge")) : ""}</div>` : ""}</div></div>
        <div class="sub"><div class="eyebrow">${esc(t("lifeLevel"))}</div>
          <div class="lifelvl">${chip(lv)}<span class="when">${range(M.bday(Yr), M.bday(Yr + 1))}</span><span class="m">${esc(means[lv])}</span></div></div>`;
    }
    $("sheetKind").textContent = sheet.kind === "life" ? t("sheetLife") : t("sheetYear");
    $("sheetTitle").textContent = head;
    $("sheetBody").innerHTML = body;
    $("sheetBody").scrollTop = 0;
    $("sheetClose").setAttribute("aria-label", t("close"));
    $("sheetPrev").setAttribute("aria-label", t("prev"));
    $("sheetNext").setAttribute("aria-label", t("next"));
    $("sheetPrev").disabled = sheet.idx <= 0;
    $("sheetNext").disabled = sheet.idx >= sheet.items.length - 1;
    $("sheetOpen").hidden = sheet.kind !== "life";
    $("sheetSpacer").hidden = sheet.kind === "life";
    $("sheetOpen").textContent = t("openYear");
  }

  function renderAll() {
    renderStatic();
    $("inDay").value = S.d; $("inMonth").value = String(S.m); $("inYear").value = S.y;
    $("sampleNote").innerHTML = S.isSample ? t("sample") : "";
    renderNow(); renderLife(); renderYear(); renderZeroList(); renderSheet();
  }

  /* ---------- input ---------- */
  function setDate(d, m, y, isSample) {
    S.d = d; S.m = m; S.y = y; S.isSample = !!isSample;
    closeSheet();
    M = model(d, m, y);
    applyPreset("near");
    S.period = today >= M.bday(y) ? M.periodOf(today) : y;
    if (!isSample) {
      store.set("date", `${d}.${m}.${y}`);
      try { history.replaceState(null, "", "#" + `${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.${y}`); } catch (e) {}
    }
  }
  function parseDate(str) {
    const mt = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(str || "");
    if (!mt) return null;
    const d = +mt[1], m = +mt[2], y = +mt[3];
    if (m < 1 || m > 12 || y < 1900 || y > 2100 || d < 1 || d > dim(y, m)) return null;
    return { d, m, y };
  }

  $("birthForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const d = parseInt($("inDay").value, 10), m = parseInt($("inMonth").value, 10), y = parseInt($("inYear").value, 10);
    const err = $("err");
    if (!(y >= 1900 && y <= 2100)) { err.textContent = t("errYear"); return; }
    if (!(d >= 1 && d <= dim(y, m))) { err.textContent = t("errDate"); return; }
    err.textContent = "";
    setDate(d, m, y, false);
    renderAll();
  });
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    S.lang = b.dataset.lang; store.set("lang", S.lang); $("err").textContent = ""; renderAll();
  }));
  $("lifePresets").addEventListener("click", ev => {
    const b = ev.target.closest("[data-preset]"); if (!b) return;
    applyPreset(b.dataset.preset); renderLife();
  });
  function rangeChange() {
    let f = parseInt($("inFrom").value, 10), to = parseInt($("inTo").value, 10);
    if (!Number.isFinite(f)) f = S.from; if (!Number.isFinite(to)) to = S.to;
    f = Math.max(M.y, Math.min(f, M.y + 150));
    to = Math.max(f + 2, Math.min(to, f + 150));
    S.from = f; S.to = to; S.preset = ""; renderLife();
  }
  $("inFrom").addEventListener("change", rangeChange);
  $("inTo").addEventListener("change", rangeChange);
  const openYear = Yr => { S.period = Yr; renderYear(); $("yearPanel").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); };
  $("lifeTable").addEventListener("click", ev => { const b = ev.target.closest("[data-year]"); if (b) openYear(+b.dataset.year); });
  $("zzList").addEventListener("click", ev => { const b = ev.target.closest("[data-year]"); if (b) openYear(+b.dataset.year); });
  $("inPeriod").addEventListener("change", ev => { S.period = +ev.target.value; renderYear(); });
  $("prevYear").addEventListener("click", () => { S.period = Math.max(M.y, S.period - 1); renderYear(); });
  $("nextYear").addEventListener("click", () => { S.period = Math.min(M.y + 100, S.period + 1); renderYear(); });
  $("curYear").addEventListener("click", () => { S.period = today >= M.bday(M.y) ? M.periodOf(today) : M.y; renderYear(); });

  const dlg = $("sheet");
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetPrev").addEventListener("click", () => stepSheet(-1));
  $("sheetNext").addEventListener("click", () => stepSheet(1));
  $("sheetOpen").addEventListener("click", () => { const Yr = sheet.items[sheet.idx]; closeSheet(); openYear(Yr); });
  dlg.addEventListener("click", ev => { if (ev.target === dlg) closeSheet(); });   // backdrop
  dlg.addEventListener("close", () => { sheet.kind = null; });
  dlg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft") { ev.preventDefault(); stepSheet(-1); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); stepSheet(1); }
  });
  // swipe the sheet left/right to step between points, down to close
  let sx = 0, sy = 0;
  dlg.addEventListener("touchstart", ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, { passive: true });
  dlg.addEventListener("touchend", ev => {
    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepSheet(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5 && $("sheetBody").scrollTop <= 0) closeSheet();
  }, { passive: true });

  let rz = 0, lastW = 0;
  new ResizeObserver(() => {
    const w = $("lifeChart").clientWidth;
    if (Math.abs(w - lastW) < 2) return;
    lastW = w; cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { renderLife(); renderYear(); });
  }).observe($("lifeChart"));

  /* ---------- boot ---------- */
  const savedLang = store.get("lang");
  if (savedLang && T[savedLang]) S.lang = savedLang;
  else if (/^uk/i.test(navigator.language)) S.lang = "uk";
  else if (!/^(ru|be|kk)/i.test(navigator.language)) S.lang = "en";
  const fromHash = parseDate(decodeURIComponent(location.hash.slice(1)));
  const saved = parseDate(store.get("date"));
  if (fromHash) setDate(fromHash.d, fromHash.m, fromHash.y, false);
  else if (saved) setDate(saved.d, saved.m, saved.y, false);
  else setDate(SAMPLE.d, SAMPLE.m, SAMPLE.y, true);
  renderAll();
  window.addEventListener("hashchange", () => {
    const p = parseDate(decodeURIComponent(location.hash.slice(1)));
    if (p) { setDate(p.d, p.m, p.y, false); renderAll(); }
  });

  // exposed for quick checks in the console
  window.energyModel = model;
})();
</script>
</body>
</html>
