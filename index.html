<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График энергопотенциала</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Калькулятор графика энергопотенциала по дате рождения: график «Жизнь» по годам и график «Год» по месяцам.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a calculator band (date + "now" status) over two swipeable timeline panels — Life by years, Year by months — then zero periods and the number key. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --ink: #141b2d;
  --muted: #586178;
  --line: #d4d9e4;
  --accent: #2c41b0;
  --accent-ink: #ffffff;
  --zero: #c4352a;
  --zero-soft: rgba(196, 53, 42, .12);

  --b0: #fbe9e6; --b1: #ffd6cf; --b2: #ffe2c4; --b3: #fff2b5; --b4: #c8f0d4;
  --b5: #c6eef2; --b6: #cfe1f8; --b7: #e0dcfa; --b8: #f3dc96; --b9: #e3e6ee;

  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2d; --ink: #e6eaf3; --muted: #98a1b6; --line: #2a3349;
    --accent: #93a5ff; --accent-ink: #0e1320; --zero: #ff7b6c; --zero-soft: rgba(255, 123, 108, .14);
    --b0: #2c1b20; --b1: #3d2328; --b2: #3b2d1f; --b3: #36331c; --b4: #1b3527;
    --b5: #18343a; --b6: #1b2a42; --b7: #29253f; --b8: #3c3219; --b9: #252a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2d; --ink: #e6eaf3; --muted: #98a1b6; --line: #2a3349;
  --accent: #93a5ff; --accent-ink: #0e1320; --zero: #ff7b6c; --zero-soft: rgba(255, 123, 108, .14);
  --b0: #2c1b20; --b1: #3d2328; --b2: #3b2d1f; --b3: #36331c; --b4: #1b3527;
  --b5: #18343a; --b6: #1b2a42; --b7: #29253f; --b8: #3c3219; --b9: #252a35;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: grid;
  gap: 28px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(22px, 3.6vw, 34px); line-height: 1.15; }
h2 { font-size: 20px; line-height: 1.25; }
h3 { font-size: 14px; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top .lede { max-width: 62ch; margin-top: 8px; color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* calculator band */
.band { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
form.birth { display: grid; gap: 14px; align-content: start; }
.fields { display: grid; grid-template-columns: 72px minmax(0, 1fr) 96px; gap: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .ctl select {
  width: 100%; min-width: 0; height: 42px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  font-family: var(--f-mono); font-size: 16px; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--f-body); }
.btn { height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.formrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.err { color: var(--zero); font-size: 13px; min-height: 1.2em; }
.sample { font-size: 13px; color: var(--muted); }
.sample b { font-weight: 600; color: var(--ink); }

.now { display: grid; gap: 14px; }
.now-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px; border-radius: 8px; background: var(--bg); }
.stat .big { grid-row: span 3; width: 56px; height: 64px; display: grid; place-items: center; border-radius: 8px; font: 700 34px/1 var(--f-display); }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .mean { font-weight: 500; line-height: 1.3; }
.stat .when { font: 400 12px/1.3 var(--f-mono); color: var(--muted); }
.zz { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border: 1px dashed var(--line); font-size: 14px; }
.zz.on { border: 1px solid var(--zero); background: var(--zero-soft); }
.zz .dot { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--line); }
.zz.on .dot { background: var(--zero); }

/* panels */
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.panel > * { min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font: 500 clamp(18px, 2.6vw, 24px)/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.formula .op { color: var(--muted); font-weight: 400; }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-grid; place-items: center; min-width: 30px; height: 36px; padding: 0 6px; border-radius: 6px; font: 600 20px/1 var(--f-mono); color: var(--ink); }
.chip.z { box-shadow: inset 0 0 0 2px var(--zero); }
.hint { font-size: 13px; color: var(--muted); max-width: 80ch; }
.ctls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ctl select { height: 34px; font-size: 14px; width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 0 12px; height: 32px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* swipeable timeline */
.chart-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.vis { font: 500 13px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.vis .arr { color: var(--muted); }
.keyline { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.keyline span { display: inline-flex; align-items: center; gap: 6px; }
.keyline i { display: inline-block; width: 22px; border-top: 2.5px solid var(--accent); }
.keyline i.dash { border-top: 2px dashed var(--ink); opacity: .6; }
.tl { position: relative; min-width: 0; }
.tl-y { position: absolute; left: 0; top: 0; width: 30px; display: block; }
.tl-scroll {
  margin-left: 30px; overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
  cursor: grab; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.tl-scroll.dragging { cursor: grabbing; }
.tl-content { position: relative; }
.tl-svg { position: absolute; top: 0; display: block; }
.tl text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.tl .yl { fill: var(--ink); font-weight: 600; }
.tl .yr { fill: var(--ink); font-weight: 600; }
.tl .tdy { fill: var(--accent); font-weight: 600; }
.tl .pill { fill: var(--accent-ink); font-weight: 600; font-size: 12px; }

.readout {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
  padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
}
.readout .big { width: 52px; height: 58px; display: grid; place-items: center; border-radius: 8px; font: 700 30px/1 var(--f-display); }
.readout .big.z { box-shadow: inset 0 0 0 2px var(--zero); }
.readout .rd { display: grid; gap: 2px; min-width: 0; }
.readout .when { font: 600 15px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.readout .mean { font-size: 13px; line-height: 1.35; }
.readout .peak { font: 400 12px/1.3 var(--f-mono); color: var(--muted); }
.readout .badges { margin-top: 2px; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.pts { border-collapse: collapse; width: 100%; font: 400 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
table.pts th, table.pts td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.pts tr:last-child td { border-bottom: 0; }
table.pts th { font: 700 18px/1 var(--f-mono); color: var(--ink); }
table.pts th.rowh, table.pts td.rowh { text-align: left; font: 500 12px/1.2 var(--f-body); color: var(--muted); }
table.pts td.out { color: var(--muted); opacity: .45; }
table.pts td.cur { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 4px; font-weight: 600; color: var(--accent); }
table.pts td button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }

/* zero periods */
.zlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.zlist li { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-family: var(--f-mono); font-size: 14px; }
.zlist li .ago { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.zlist li button { margin-left: auto; }

/* legend */
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; padding: 4px 0; }
.legend .chip { width: 36px; }

/* period details: centered card on desktop, bottom sheet on phones */
body:has(dialog[open]) { overflow: hidden; }
dialog.sheet {
  border: 0; padding: 0; margin: auto;
  width: min(520px, calc(100% - 32px)); max-width: none; max-height: min(86vh, 760px);
  border-radius: 14px; background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3); overflow: hidden;
}
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(8, 12, 22, .5); }
.grip { display: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { font: 500 18px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.sheet-body { padding: 16px 20px; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 14px; align-content: start; }
.sheet-foot { display: flex; gap: 8px; padding: 12px 20px max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet-foot .grow { flex: 1; }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-size: 22px; line-height: 1; }
.sv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.sv .big { width: 64px; height: 72px; display: grid; place-items: center; border-radius: 10px; font: 700 40px/1 var(--f-display); }
.sv .big.z { box-shadow: inset 0 0 0 2px var(--zero); }
.sv .mean { font-weight: 500; line-height: 1.35; }
.sv .peak { font: 400 12px/1.3 var(--f-mono); color: var(--muted); margin-top: 4px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.badge { padding: 2px 8px; border-radius: 999px; font: 600 11px/1.5 var(--f-body); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); }
.badge.z { background: var(--zero); color: var(--surface); }
.sub { display: grid; gap: 8px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.mlist li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
.mlist li .chip { grid-row: span 2; width: 36px; height: 34px; font-size: 18px; }
.mlist li.zz { background: var(--zero-soft); }
.mlist li.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.mlist .when { font: 400 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.mlist .m { font-size: 12px; line-height: 1.3; color: var(--muted); }
.mlist .top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mlist .badge { font-size: 10px; padding: 0 6px; }
@media (max-width: 600px) {
  dialog.sheet { margin: auto 0 0; width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; }
  .grip { display: block; flex: none; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
  .sheet-head { padding-top: 10px; }
  .sheet-head, .sheet-body, .sheet-foot {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}
@media (prefers-reduced-motion: no-preference) {
  dialog.sheet[open] { animation: pop .18s ease-out; }
}
@media (prefers-reduced-motion: no-preference) and (max-width: 600px) {
  dialog.sheet[open] { animation: rise .22s ease-out; }
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes rise { from { transform: translateY(100%); } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot { font-size: 12px; color: var(--muted); max-width: 80ch; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

@media (max-width: 860px) {
  .band, .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .now-grid, .legend { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  .fields { grid-template-columns: 60px minmax(0, 1fr) 84px; }
  table.pts th, table.pts td { padding: 6px 5px; font-size: 12px; }
  table.pts th { font-size: 16px; }
  /* 16px keeps iOS from zooming in on focus */
  .ctl select { font-size: 16px; height: 38px; }
  .seg button { height: 36px; }
  .btn.small { height: 38px; }
  .panel-head .ctls { width: 100%; }
  .readout { grid-template-columns: auto minmax(0, 1fr); }
  .readout .btn { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow">Динамика состояний</div>
      <h1 data-i="title">График энергопотенциала</h1>
      <p class="lede" data-i="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uk">UA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="band">
    <form class="card birth" id="birthForm" novalidate>
      <h2 data-i="birth">Дата рождения</h2>
      <div class="fields">
        <div class="field"><label for="inDay" data-i="day">День</label><input id="inDay" inputmode="numeric" autocomplete="bday-day" maxlength="2"></div>
        <div class="field"><label for="inMonth" data-i="month">Месяц</label><select id="inMonth" autocomplete="bday-month"></select></div>
        <div class="field"><label for="inYear" data-i="year">Год</label><input id="inYear" inputmode="numeric" autocomplete="bday-year" maxlength="4"></div>
      </div>
      <div class="formrow">
        <button class="btn" type="submit" data-i="build">Построить</button>
        <span class="sample" id="sampleNote"></span>
      </div>
      <div class="err" id="err" role="alert"></div>
    </form>

    <div class="card now" aria-live="polite">
      <div class="panel-head">
        <h2 data-i="now">Сейчас</h2>
        <span class="eyebrow" id="todayLbl"></span>
      </div>
      <div class="now-grid" id="nowGrid"></div>
      <div class="zz" id="zzNow"><span class="dot"></span><span></span></div>
    </div>
  </section>

  <section class="card panel" id="lifePanel">
    <div class="panel-head">
      <div>
        <div class="eyebrow" data-i="lifeEyebrow">График «Жизнь»</div>
        <h2 data-i="lifeTitle">Энергопотенциал по годам</h2>
      </div>
      <div class="ctls">
        <div class="seg" role="group" id="lifeSpan">
          <button type="button" data-span="10"></button>
          <button type="button" data-span="20"></button>
          <button type="button" data-span="40"></button>
        </div>
        <button class="btn ghost small" type="button" id="lifeToday" data-i="todayBtn">Сегодня</button>
      </div>
    </div>
    <div class="formula" id="lifeFormula"></div>
    <p class="hint" id="lifeHint"></p>
    <div class="chart-bar"><span class="vis" id="lifeVis"></span></div>
    <div id="lifeChart"></div>
    <div class="readout" id="lifeRead" aria-live="polite"></div>
    <div class="tablebox"><table class="pts" id="lifeTable"></table></div>
  </section>

  <section class="card panel" id="yearPanel">
    <div class="panel-head">
      <div>
        <div class="eyebrow" data-i="yearEyebrow">График «Год»</div>
        <h2 id="yearTitle"></h2>
      </div>
      <div class="ctls">
        <button class="btn ghost small" type="button" id="prevYear" aria-label="−1">←</button>
        <span class="ctl"><label for="inPeriod" class="sr" data-i="periodLbl">Год</label><select id="inPeriod"></select></span>
        <button class="btn ghost small" type="button" id="nextYear" aria-label="+1">→</button>
        <div class="seg" role="group" id="yearSpan">
          <button type="button" data-span="6"></button>
          <button type="button" data-span="12"></button>
          <button type="button" data-span="24"></button>
        </div>
        <button class="btn ghost small" type="button" id="yearToday" data-i="todayBtn">Сегодня</button>
      </div>
    </div>
    <div class="formula" id="yearFormula"></div>
    <p class="hint" id="yearHint"></p>
    <div class="chart-bar">
      <span class="vis" id="yearVis"></span>
      <span class="keyline"><span><i></i><b data-i="year" style="font-weight:500">Год</b></span><span><i class="dash"></i><b data-i="life" style="font-weight:500">Жизнь</b></span></span>
    </div>
    <div id="yearChart"></div>
    <div class="readout" id="yearRead" aria-live="polite"></div>
    <div class="tablebox"><table class="pts" id="yearTable"></table></div>
  </section>

  <section class="split">
    <div class="card panel">
      <div>
        <div class="eyebrow" data-i="zzEyebrow">Ноль в нуле</div>
        <h2 data-i="zzTitle">Ближайшие периоды «ноль в нуле»</h2>
      </div>

        a += `<text class="yl" x="15" y="${Y(v) + 4}" text-anchor="middle">${v}</text>`;
      }
      yax.setAttribute("viewBox", `0 0 30 ${me.H}`); yax.setAttribute("width", 30); yax.setAttribute("height", me.H);
      yax.innerHTML = a;
      if (c != null) me.scrollTo(c, "center", false);
      me.draw(true);
    };

    me.scrollTo = (ms, align, smooth) => {
      let x = X(ms) - (align === "center" ? me.vw / 2 : align === "start" ? me.vw * 0.06 : 0);
      x = Math.max(0, Math.min(x, me.total - me.vw));
      if (smooth && !reduced()) sc.scrollTo({ left: x, behavior: "smooth" });
      else { sc.scrollLeft = x; me.draw(true); }
    };

    me.draw = (force) => {
      if (!me.cfg) return;
      const sl = sc.scrollLeft, vw = me.vw;
      const need = force || (sl < me.r0 + vw * 0.25 && me.r0 > 0) || (sl + vw > me.r1 - vw * 0.25 && me.r1 < me.total);
      if (!need) return;
      const r0 = me.r0 = Math.max(0, Math.floor(sl - vw)), r1 = me.r1 = Math.min(me.total, Math.ceil(sl + 2 * vw));
      const H = me.H, ih = H - TOP - BOT, cfg = me.cfg;
      const tA = Tm(r0), tB = Tm(r1);
      const P = cfg.pts;
      const i0 = Math.max(0, bsearch(P, tA, "t")), i1 = Math.min(P.length - 1, bsearch(P, tB, "t") + 1);
      let s = `<defs>${hatch}</defs>`;
      for (let v = 0; v <= 9; v++) s += `<rect x="${r0}" y="${Y(v + .5)}" width="${r1 - r0}" height="${ih / 10}" fill="${bandFill(v)}"/>`;
      // zero-in-zero windows
      for (const z of M.zz) {
        if (z.end < tA || z.start > tB) continue;
        const a = X(z.start), b = X(z.end);
        s += `<rect x="${a}" y="${TOP}" width="${Math.max(1, b - a)}" height="${ih}" fill="var(--zero)" fill-opacity=".15"/>`;
      }
      // ticks
      for (const tk of cfg.ticks(i0, i1, me.ppm)) {
        const x = X(tk.t);
        s += `<line x1="${x}" x2="${x}" y1="${TOP}" y2="${TOP + ih}" stroke="var(--ink)" stroke-opacity="${tk.major ? .28 : .08}"${tk.major ? ` stroke-dasharray="2 3"` : ""}/>`;
        if (tk.label) s += `<text x="${x}" y="${TOP + ih + 16}" text-anchor="middle">${esc(tk.label)}</text>`;
        if (tk.label2) s += `<text class="yr" x="${x}" y="${TOP + ih + 32}" text-anchor="middle">${esc(tk.label2)}</text>`;
      }
      // today
      const cur = S.sel[kind];
      const tx = X(NOW);
      if (tx >= r0 && tx <= r1) {
        s += `<line x1="${tx}" x2="${tx}" y1="${TOP - 4}" y2="${TOP + ih}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
        if (cur == null || Math.abs(X(cur) - tx) > 44) s += `<text class="tdy" x="${tx}" y="${TOP - 8}" text-anchor="middle">${esc(t("today"))}</text>`;
      }
      // Life line under the Year chart
      if (cfg.overlay) {
        const O = cfg.overlay, j0 = Math.max(0, bsearch(O, tA, "t")), j1 = Math.min(O.length - 1, bsearch(O, tB, "t") + 1);
        let d = "";
        for (let j = j0; j <= j1; j++) d += `${j > j0 ? "L" : "M"}${X(O[j].t).toFixed(1)},${Y(O[j].v).toFixed(1)}`;
        s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.75" stroke-dasharray="6 4"/>`;
      }
      // selected run: a bar across its band, so the stretch of time is visible
      let run = null;
      if (cur != null) {
        run = runs(kind)[runIndexAt(runs(kind), cur)];
        const a = Math.max(X(run.start), r0 - 4), b = Math.min(X(run.end), r1 + 4);
        s += `<rect x="${a}" y="${Y(run.b + .5) + 1}" width="${Math.max(2, b - a)}" height="${ih / 10 - 2}" rx="3" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="1.5"/>`;
      }
      // main line + peaks
      let d = "";
      for (let i = i0; i <= i1; i++) d += `${i > i0 ? "L" : "M"}${X(P[i].t).toFixed(1)},${Y(P[i].v).toFixed(1)}`;
      s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      for (let i = i0; i <= i1; i++) {
        const x = X(P[i].t), y = Y(P[i].v);
        s += P[i].v === 0
          ? `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--surface)" stroke="var(--zero)" stroke-width="2.25"/>`
          : `<circle cx="${x}" cy="${y}" r="3.75" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`;
      }
      // cursor
      if (cur != null) {
        const x = X(cur), y = Y(valueAt(P, cur));
        s += `<line x1="${x}" x2="${x}" y1="${TOP}" y2="${TOP + ih}" stroke="var(--ink)" stroke-width="1.5"/>`;
        s += `<rect x="${x - 13}" y="2" width="26" height="18" rx="9" fill="var(--ink)"/><text class="pill" x="${x}" y="15" text-anchor="middle" style="fill:var(--bg)">${run.b}</text>`;
        s += `<circle cx="${x}" cy="${y}" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>`;
      }
      svg.style.left = r0 + "px";
      svg.setAttribute("viewBox", `${r0} 0 ${r1 - r0} ${H}`);
      svg.setAttribute("width", r1 - r0);
      svg.setAttribute("height", H);
      svg.innerHTML = s;
    };

    let raf = 0;
    sc.addEventListener("scroll", () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; me.draw(false); me.cfg && me.cfg.onScroll && me.cfg.onScroll(); });
    }, { passive: true });

    // mouse: drag to pan (touch already scrolls natively)
    let drag = null, moved = false;
    sc.addEventListener("pointerdown", ev => {
      if (ev.pointerType !== "mouse" || ev.button !== 0) return;
      drag = { x: ev.clientX, sl: sc.scrollLeft }; moved = false;
    });
    window.addEventListener("pointermove", ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x;
      if (Math.abs(dx) > 4) { moved = true; sc.classList.add("dragging"); }
      if (moved) sc.scrollLeft = drag.sl - dx;
    });
    window.addEventListener("pointerup", () => {
      if (!drag) return;
      drag = null; sc.classList.remove("dragging");
      setTimeout(() => { moved = false; }, 0);
    });
    content.addEventListener("click", ev => {
      if (moved || !me.cfg) return;
      const ms = Tm(ev.clientX - content.getBoundingClientRect().left);
      me.cfg.onTap(Math.max(me.cfg.t0, Math.min(me.cfg.t1 - 1, ms)));
    });
    sc.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); me.cfg.onTap(me.centerT()); }
    });
    return me;
  }

  const TL = { life: Timeline($("lifeChart"), "life"), year: Timeline($("yearChart"), "year") };

  function lifeTicks(i0, i1, ppm) {
    const step = [1, 2, 5, 10, 20].find(s => s * ppm * YEAR >= 40) || 20;
    const out = [];
    for (let i = i0; i <= i1; i++) {
      const p = M.lifePts[i], on = (p.Y - M.y) % step === 0;
      out.push({ t: p.t, label: on ? String(p.Y) : "", major: false });
    }
    return out;
  }
  function yearTicks(i0, i1, ppm) {
    const px = ppm * MONTH;
    const step = [1, 2, 3, 6].find(s => s * px >= 34) || 6, withDay = px >= 52;
    const out = [];
    for (let i = i0; i <= i1; i++) {
      const p = M.yearPts[i];
      const lbl = p.k % step === 0 ? (withDay ? `${new Date(p.t).getDate()} ${monShort(p.t)}` : monShort(p.t)) : "";
      out.push({ t: p.t, label: lbl, label2: p.k === 0 ? String(p.Y) : "", major: p.k === 0 });
    }
    return out;
  }

  /* ---------- selection + readouts ---------- */
  function select(kind, ms, scroll) {
    S.sel[kind] = ms;
    TL[kind].draw(true);
    renderReadout(kind);
    if (scroll && !TL[kind].isVisible(ms)) TL[kind].scrollTo(ms, "center", true);
  }

  const badge = (cls, txt) => `<span class="badge${cls}">${esc(txt)}</span>`;
  const chip = v => `<span class="chip${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span>`;
  const bigBox = (v, cls) => `<span class="big${v === 0 ? " z" : ""}" style="background:${band(v)}">${v}</span>`;
  const isNowRun = r => NOW >= r.start && NOW < r.end;

  function renderReadout(kind) {
    const R = runs(kind), r = R[runIndexAt(R, S.sel[kind])];
    const pk = peakOf(kind, r);
    const bs = (isNowRun(r) ? badge("", t("nowBadge")) : "") + (inZZ(S.sel[kind]) ? badge(" z", t("zzBadge")) : "");
    $(kind + "Read").innerHTML = `${bigBox(r.b)}
      <div class="rd"><div class="when">${spanText(r.start, r.end)}</div>
        <div class="mean">${esc(t("meanings")[r.b])}</div>
        ${pk ? `<div class="peak">${esc(t("peak"))} · ${fmt(pk.t)}</div>` : ""}
        ${bs ? `<div class="badges">${bs}</div>` : ""}</div>
      <button class="btn ghost small" type="button" data-details="${kind}">${esc(t("details"))} →</button>`;
  }

  /* ---------- renderers ---------- */
  const chips = D => `<span class="chips">${D.map(chip).join("")}</span>`;

  function renderStatic() {
    document.documentElement.lang = S.lang;
    document.querySelectorAll("[data-i]").forEach(el => { const v = t(el.dataset.i); if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
    document.title = t("title");
    const mSel = $("inMonth"), keep = mSel.value || String(S.m);
    const mf = new Intl.DateTimeFormat(t("locale"), { month: "long" });
    mSel.innerHTML = Array.from({ length: 12 }, (_, i) => {
      const name = mf.format(new Date(2000, i, 1));
      return `<option value="${i + 1}">${String(i + 1).padStart(2, "0")} · ${name.charAt(0).toUpperCase() + name.slice(1)}</option>`;
    }).join("");
    mSel.value = keep;
    $("legend").innerHTML = t("meanings").map((txt, v) => ({ txt, v })).reverse()
      .map(({ txt, v }) => `<li>${chip(v)}<span>${esc(txt)}</span></li>`).join("");
    $("todayLbl").textContent = fmt(today);
    document.querySelectorAll("#lifeSpan [data-span]").forEach(b => { b.textContent = t("spanYears")(+b.dataset.span); b.setAttribute("aria-pressed", String(+b.dataset.span === S.lifeSpan)); });
    document.querySelectorAll("#yearSpan [data-span]").forEach(b => { b.textContent = t("spanMonths")(+b.dataset.span); b.setAttribute("aria-pressed", String(+b.dataset.span === S.yearSpan)); });
  }

  function renderNow() {
    const grid = $("nowGrid"), zz = $("zzNow");
    if (NOW < M.t0) {
      grid.innerHTML = `<p class="muted">${esc(t("notBorn"))}</p>`;
      zz.hidden = true;
      return;
    }
    zz.hidden = false;
    const card = (lbl, r) => `<div class="stat">${bigBox(r.b)}
      <span class="lbl">${esc(lbl)}</span><span class="mean">${esc(t("meanings")[r.b])}</span>
      <span class="when">${spanText(r.start, r.end)}</span></div>`;
    grid.innerHTML = card(t("lifeNow"), M.lifeRuns[runIndexAt(M.lifeRuns, NOW)]) + card(t("monthNow"), M.yearRuns[runIndexAt(M.yearRuns, NOW)]);
    const on = inZZ(NOW);
    zz.classList.toggle("on", on);
    let msg = on ? t("zzOn") : t("zzOff");
    if (!on) {
      const next = M.zz.find(z => z.start > NOW);
      if (next) msg += " " + t("zzNext").replace("{date}", fmt(roundDay(next.start)));
    }
    zz.lastElementChild.textContent = msg;
  }

  function setupTimelines(recenter) {
    $("lifeFormula").innerHTML = `<span>${M.d}</span><span class="op">×</span><span>${M.m}</span><span class="op">×</span><span>${M.y}</span><span class="op">=</span><span>${M.lifeProduct}</span><span class="op">→</span>${chips(M.lifeDigits)}`;
    $("lifeHint").textContent = t("lifeHint").replace("{n}", t("years")(M.L));
    $("yearHint").textContent = t("yearHint");
    TL.life.cfg = {
      t0: M.t0, t1: M.t1, pts: M.lifePts, ticks: lifeTicks, span: () => S.lifeSpan * YEAR,
      onTap: ms => select("life", ms), onScroll: onLifeScroll
    };
    TL.year.cfg = {
      t0: M.t0, t1: M.t1, pts: M.yearPts, overlay: M.lifePts, ticks: yearTicks, span: () => S.yearSpan * MONTH,
      onTap: ms => select("year", ms), onScroll: onYearScroll
    };
    TL.life.layout(!recenter); TL.year.layout(!recenter);
    if (recenter) {
      TL.life.scrollTo(S.sel.life, "center", false);
      TL.year.scrollTo(S.sel.year, "center", false);
    }
    renderReadout("life"); renderReadout("year");
    lastLifeRange = ""; onLifeScroll();
    S.period = -1; onYearScroll();
  }

  /* life chart: visible years + table that follows the scroll */
  let lastLifeRange = "";
  function onLifeScroll() {
    const [a, b] = TL.life.visible();
    const ya = new Date(a).getFullYear(), yb = new Date(b).getFullYear();
    $("lifeVis").innerHTML = `${ya} <span class="arr">–</span> ${yb}`;
    const key = ya + ":" + yb;
    if (key !== lastLifeRange) { lastLifeRange = key; renderLifeTable(Math.max(M.y, ya), Math.min(M.END, yb)); }
  }
  function renderLifeTable(from, to) {
    const cur = NOW >= M.t0 ? M.periodOf(NOW) : null;
    const start = M.y + Math.floor((from - M.y) / M.L) * M.L;
    const rows = Math.floor((to - start) / M.L) + 1;
    let h = `<tr><th class="rowh">${esc(t("colValue"))}</th>${M.lifeDigits.map(v => `<th style="background:${band(v)}">${v}</th>`).join("")}</tr>`;
    for (let r = 0; r < rows; r++) {
      h += `<tr>${r === 0 ? `<td class="rowh" rowspan="${rows}">${esc(t("colYear"))}</td>` : ""}`;
      for (let k = 0; k < M.L; k++) {
        const Yr = start + r * M.L + k, out = Yr < from || Yr > to;
        h += `<td class="${out ? "out" : ""}${Yr === cur ? " cur" : ""}">${out ? Yr : `<button type="button" data-year="${Yr}">${Yr}</button>`}</td>`;
      }
      h += `</tr>`;
    }
    $("lifeTable").innerHTML = h;
  }

  /* year chart: the period at the centre drives the title, formula, picker and table */
  function onYearScroll() {
    const [a, b] = TL.year.visible();
    $("yearVis").innerHTML = `${fmt(roundDay(a))} <span class="arr">–</span> ${fmt(roundDay(b))}`;
    const Yr = Math.max(M.y, Math.min(M.END - 1, M.periodOf(TL.year.centerT())));
    if (Yr !== S.period) { S.period = Yr; renderYearHead(); }
  }
  function renderYearHead() {
    const Yr = S.period;
    const sel = $("inPeriod");
    if (sel.options.length !== SPAN_YEARS || +sel.options[0].value !== M.y) {
      sel.innerHTML = Array.from({ length: SPAN_YEARS }, (_, i) => M.y + i).map(v => `<option value="${v}">${v} – ${v + 1}</option>`).join("");
    }
    sel.value = String(Yr);
    $("prevYear").disabled = Yr <= M.y; $("nextYear").disabled = Yr >= M.END - 1;
    const { product, digits: D, pts } = M.yearPoints(Yr);
    $("yearTitle").textContent = t("yearTitle").replace("{date}", fmt(M.bday(Yr)));
    $("yearFormula").innerHTML = `<span>${M.d}</span><span class="op">×</span><span>${M.m}</span><span class="op">×</span><span>${Yr}</span><span class="op">=</span><span>${product}</span><span class="op">→</span>${chips(D)}`;
    const rows = Math.ceil(12 / D.length);
    let h = `<tr><th class="rowh">${esc(t("colValue"))}</th>${D.map(v => `<th style="background:${band(v)}">${v}</th>`).join("")}</tr>`;
    for (let r = 0; r < rows; r++) {
      h += `<tr>${r === 0 ? `<td class="rowh" rowspan="${rows}">${esc(t("colStart"))}</td>` : ""}`;
      for (let c = 0; c < D.length; c++) {
        const p = pts[r * D.length + c];
        if (!p) { h += `<td></td>`; continue; }
        const isCur = +today === +p.t;
        const withYear = p.k === 0 || p.k === 11 || p.t.getMonth() === 0;
        h += `<td class="${isCur ? "cur" : ""}"><button type="button" data-peak="${+p.t}">${fmt(p.t, withYear)}</button></td>`;
      }
      h += `</tr>`;
    }
    $("yearTable").innerHTML = h;
  }

  function renderZeroList() {
    const list = M.zz.filter(z => z.end > NOW && z.start < NOW + 60 * YEAR).slice(0, 8);
    $("zzList").innerHTML = list.length ? list.map(z => {
      const now = NOW >= z.start && NOW < z.end;
      return `<li><span>${spanText(z.start, z.end)}</span>${now ? `<span class="ago">${esc(t("inNow"))}</span>` : ""}<button class="btn ghost small" type="button" data-zz="${(z.start + z.end) / 2}">${esc(t("show"))}</button></li>`;
    }).join("") : `<li class="muted">${esc(t("zzNone"))}</li>`;
  }

  /* ---------- period details sheet ---------- */
  const sheet = { kind: null, idx: 0 };

  function openSheet(kind) {
    sheet.kind = kind; sheet.idx = runIndexAt(runs(kind), S.sel[kind]);
    renderSheet();
    const dlg = $("sheet");
    if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); } }
  }
  function closeSheet() {
    const dlg = $("sheet");
    if (dlg.open) { try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); } }
    sheet.kind = null;
  }
  function stepSheet(dir) {
    const R = runs(sheet.kind), i = sheet.idx + dir;
    if (i < 0 || i >= R.length) return;
    sheet.idx = i;
    select(sheet.kind, (R[i].start + R[i].end) / 2, true);
    renderSheet();
  }
  function renderSheet() {
    if (!sheet.kind) return;
    const kind = sheet.kind, R = runs(kind), O = kind === "life" ? M.yearRuns : M.lifeRuns;
    const r = R[sheet.idx], means = t("meanings");
    const pk = peakOf(kind, r);
    const hasZZ = M.zz.some(z => z.end > r.start && z.start < r.end);
    const bs = (isNowRun(r) ? badge("", t("nowBadge")) : "") + (hasZZ ? badge(" z", t("zzBadge")) : "");
    let list = "";
    for (let j = runIndexAt(O, r.start); j < O.length && O[j].start < r.end; j++) {
      const o = O[j], s = Math.max(o.start, r.start), e = Math.min(o.end, r.end);
      if (e - s < DAY / 2) continue;
      const zz = o.b === 0 && r.b === 0, cur = NOW >= s && NOW < e;
      list += `<li class="${zz ? "zz" : ""}${cur ? " cur" : ""}">${chip(o.b)}
        <span class="top-row"><span class="when">${spanText(s, e)}</span>${cur ? badge("", t("nowBadge")) : ""}${zz ? badge(" z", t("zzBadge")) : ""}</span>
        <span class="m">${esc(means[o.b])}</span></li>`;
    }
    $("sheetKind").textContent = kind === "life" ? t("sheetLife") : t("sheetYear");
    $("sheetTitle").textContent = spanText(r.start, r.end);
    $("sheetBody").innerHTML = `<div class="sv">${bigBox(r.b)}
        <div><div class="mean">${esc(means[r.b])}</div>
        ${pk ? `<div class="peak">${esc(t("peak"))} · ${fmt(pk.t)}</div>` : ""}
        ${bs ? `<div class="badges">${bs}</div>` : ""}</div></div>
      <div class="sub"><div class="eyebrow">${esc(t(kind === "life" ? "inYear" : "inLife"))}</div><ul class="mlist">${list}</ul></div>`;
    $("sheetBody").scrollTop = 0;
    $("sheetClose").setAttribute("aria-label", t("close"));
    $("sheetPrev").setAttribute("aria-label", t("prev"));
    $("sheetNext").setAttribute("aria-label", t("next"));
    $("sheetPrev").disabled = sheet.idx <= 0;
    $("sheetNext").disabled = sheet.idx >= R.length - 1;
    $("sheetOpen").hidden = kind !== "life";
    $("sheetSpacer").hidden = kind === "life";
    $("sheetOpen").textContent = t("openYear");
  }

  function renderAll(recenter) {
    renderStatic();
    $("inDay").value = S.d; $("inMonth").value = String(S.m); $("inYear").value = S.y;
    $("sampleNote").innerHTML = S.isSample ? t("sample") : "";
    renderNow(); setupTimelines(recenter); renderZeroList(); renderSheet();
  }

  /* ---------- input ---------- */
  function setDate(d, m, y, isSample) {
    S.d = d; S.m = m; S.y = y; S.isSample = !!isSample;
    closeSheet();
    M = model(d, m, y);
    const start = NOW >= M.t0 && NOW < M.t1 ? NOW : M.t0 + DAY;
    S.sel = { life: start, year: start };
    if (!isSample) {
      store.set("date", `${d}.${m}.${y}`);
      try { history.replaceState(null, "", "#" + `${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.${y}`); } catch (e) {}
    }
  }
  function parseDate(str) {
    const mt = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(str || "");
    if (!mt) return null;
    const d = +mt[1], m = +mt[2], y = +mt[3];
    if (m < 1 || m > 12 || y < 1900 || y > 2100 || d < 1 || d > dim(y, m)) return null;
    return { d, m, y };
  }
  const goPanel = id => $(id).scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
  function showOnYear(ms, align) {
    TL.year.scrollTo(ms, align, true);
    select("year", ms);
    goPanel("yearPanel");
  }

  $("birthForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const d = parseInt($("inDay").value, 10), m = parseInt($("inMonth").value, 10), y = parseInt($("inYear").value, 10);
    const err = $("err");
    if (!(y >= 1900 && y <= 2100)) { err.textContent = t("errYear"); return; }
    if (!(d >= 1 && d <= dim(y, m))) { err.textContent = t("errDate"); return; }
    err.textContent = "";
    setDate(d, m, y, false);
    renderAll(true);
  });
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    S.lang = b.dataset.lang; store.set("lang", S.lang); $("err").textContent = ""; renderAll(false);
  }));
  $("lifeSpan").addEventListener("click", ev => {
    const b = ev.target.closest("[data-span]"); if (!b) return;
    S.lifeSpan = +b.dataset.span; renderStatic(); TL.life.layout(true); onLifeScroll();
  });
  $("yearSpan").addEventListener("click", ev => {
    const b = ev.target.closest("[data-span]"); if (!b) return;
    S.yearSpan = +b.dataset.span; renderStatic(); TL.year.layout(true); onYearScroll();
  });
  $("lifeToday").addEventListener("click", () => { TL.life.scrollTo(NOW, "center", true); select("life", NOW); });
  $("yearToday").addEventListener("click", () => { TL.year.scrollTo(NOW, "center", true); select("year", NOW); });
  $("lifeTable").addEventListener("click", ev => {
    const b = ev.target.closest("[data-year]"); if (!b) return;
    const ms = +M.bday(+b.dataset.year);
    select("life", ms + 1, true);
    TL.year.scrollTo(ms, "start", true); select("year", ms + 1); goPanel("yearPanel");
  });
  $("yearTable").addEventListener("click", ev => { const b = ev.target.closest("[data-peak]"); if (b) select("year", +b.dataset.peak + 1, true); });
  $("zzList").addEventListener("click", ev => {
    const b = ev.target.closest("[data-zz]"); if (!b) return;
    const ms = +b.dataset.zz;
    select("life", ms, true); showOnYear(ms, "center");
  });
  const jumpYear = Yr => { Yr = Math.max(M.y, Math.min(M.END - 1, Yr)); TL.year.scrollTo(+M.bday(Yr), "start", true); };
  $("inPeriod").addEventListener("change", ev => jumpYear(+ev.target.value));
  $("prevYear").addEventListener("click", () => jumpYear(S.period - 1));
  $("nextYear").addEventListener("click", () => jumpYear(S.period + 1));
  document.addEventListener("click", ev => { const b = ev.target.closest("[data-details]"); if (b) openSheet(b.dataset.details); });

  const dlg = $("sheet");
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetPrev").addEventListener("click", () => stepSheet(-1));
  $("sheetNext").addEventListener("click", () => stepSheet(1));
  $("sheetOpen").addEventListener("click", () => {
    const r = M.lifeRuns[sheet.idx];
    closeSheet();
    showOnYear(Math.max(r.start, M.t0) + DAY, "start");
  });
  dlg.addEventListener("click", ev => { if (ev.target === dlg) closeSheet(); });   // backdrop
  dlg.addEventListener("close", () => { sheet.kind = null; });
  dlg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft") { ev.preventDefault(); stepSheet(-1); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); stepSheet(1); }
  });
  // swipe the sheet left/right to step between periods, down to close
  let sx = 0, sy = 0;
  dlg.addEventListener("touchstart", ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, { passive: true });
  dlg.addEventListener("touchend", ev => {
    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepSheet(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5 && $("sheetBody").scrollTop <= 0) closeSheet();
  }, { passive: true });

  let rz = 0, lastW = 0;
  new ResizeObserver(() => {
    const w = $("lifeChart").clientWidth;
    if (!M || Math.abs(w - lastW) < 2) return;
    lastW = w; cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => { TL.life.layout(true); TL.year.layout(true); onLifeScroll(); onYearScroll(); });
  }).observe($("lifeChart"));

  /* ---------- boot ---------- */
  const savedLang = store.get("lang");
  if (savedLang && T[savedLang]) S.lang = savedLang;
  else if (/^uk/i.test(navigator.language)) S.lang = "uk";
  else if (!/^(ru|be|kk)/i.test(navigator.language)) S.lang = "en";
  const fromHash = parseDate(decodeURIComponent(location.hash.slice(1)));
  const saved = parseDate(store.get("date"));
  if (fromHash) setDate(fromHash.d, fromHash.m, fromHash.y, false);
  else if (saved) setDate(saved.d, saved.m, saved.y, false);
  else setDate(SAMPLE.d, SAMPLE.m, SAMPLE.y, true);
  lastW = $("lifeChart").clientWidth;
  if (lastW && lastW < 520) { S.lifeSpan = 10; S.yearSpan = 6; }
  renderAll(true);
  window.addEventListener("hashchange", () => {
    const p = parseDate(decodeURIComponent(location.hash.slice(1)));
    if (p) { setDate(p.d, p.m, p.y, false); renderAll(true); }
  });

  // exposed for quick checks in the console
  window.energyModel = model;
  window.energyRuns = { runsOf, intersect, valueAt };
})();
</script>
</body>
</html>
